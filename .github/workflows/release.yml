name: Release

# Releases one crate per tag. Bump the version in the crate's Cargo.toml, rename the
# "Unreleased" section of its CHANGELOG.md to "<version> - <date>", commit, then push
# a tag named `<crate>-v<version>`, e.g. `secop-dwi-v0.1.1`.
# Release `compressor-dwi` first when the other crates need its new version.
on:
  push:
    tags:
      - "*-v[0-9]*"

# Avoid workflow-level permissions, instead use job-level permissions.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7

      - name: Read crate, version and changelog entry from tag
        id: tag
        run: |
          crate="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $crate version '${manifest:-not found}' in Cargo.toml"
            exit 1
          fi
          # The lines under "## <version> - <date>", up to the next "## " heading.
          awk -v v="$version" '/^## / { if (found) exit; found = ($2 == v); next } found' \
            "$crate/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No entry for $version in $crate/CHANGELOG.md"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: ./ci.sh

      # Lets a tag for an already published version (like the first, manual release)
      # still create its GitHub release.
      - name: Check if already on crates.io
        id: published
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if curl -sf -A "compressor-dwi release workflow" "https://crates.io/api/v1/crates/$CRATE/$VERSION" > /dev/null; then
            echo "Already published, skipping cargo publish."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.done != 'true'
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.done != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo publish -p "$CRATE"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.tag.outputs.crate }} ${{ steps.tag.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
