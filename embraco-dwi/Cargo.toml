[package]
name = "embraco-dwi"
version = "0.1.0"
description = "Async no_std driver for the serial interface of Embraco CF10B compressor inverters"
keywords = ["compressor", "driver", "hvac", "embraco", "dwi"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

[features]
defmt = ["dep:defmt", "compressor-dwi/defmt"]

[dependencies]
compressor-dwi      = { workspace = true }
embedded-io-async   = { workspace = true }
defmt               = { workspace = true, optional = true }
