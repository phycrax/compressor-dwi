[package]
name = "secop-dwi"
version = "0.1.0"
description = "Async no_std driver for the Dual Wire Interface (DWI) of Secop NLV/SLVE compressor drives"
keywords = ["compressor", "driver", "hvac", "secop", "dwi"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true

[features]
defmt = ["dep:defmt", "compressor-dwi/defmt"]

[dependencies]
compressor-dwi      = { workspace = true }
embedded-io-async   = { workspace = true }
defmt               = { workspace = true, optional = true }
